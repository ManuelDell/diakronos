services:
  app:
    # Safe only here: app has no published port; nginx sanitizes the headers.
    command: [uvicorn, "diakronos_app.main:app", --host, "0.0.0.0", --port, "8000", --proxy-headers, "--forwarded-allow-ips=*"]
    environment:
      BEHIND_PROXY: "1"
  nginx:
    profiles: [https]
    build: ../nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      HOST_IP: ${HOST_IP:-}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-0}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_UPLOAD_BYTES_AUDIO: ${MAX_UPLOAD_BYTES_AUDIO:-52428800}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/custom/fullchain.pem}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/custom/privkey.pem}
      NGINX_ENVSUBST_FILTER: "^(SERVER_NAME|HOST_GUARD|REDIRECT_HOST|REDIRECT_PORT|BODY_LIMIT|HSTS|CERT_PATH|KEY_PATH)$$"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - tls:/tls
      - acme:/var/www/acme:ro
      - letsencrypt:/etc/letsencrypt:ro
      - ../certs:/custom:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8081/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6
  certbot:
    profiles: [https]
    image: certbot/certbot:v4.2.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/certbot.sh"]
    environment:
      TLS_MODE: ${TLS_MODE:-selfsigned}
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-0}
    volumes:
      - ../nginx/certbot.sh:/scripts/certbot.sh:ro
      - acme:/var/www/acme
      - letsencrypt:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_healthy
volumes:
  tls:
  acme:
  letsencrypt:

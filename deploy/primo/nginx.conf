# WEB-2 — nginx-Vorbau fuer den Primo-Stack (deploy/primo/compose.yml).
#
# Aufgabenstellung: "/diakronos-sso.html statisch ausliefern, alles andere an
# primo:8080 durchreichen (inkl. WebSocket/Realtime-Header fuer PocketBase)".
#
# Warum ein Vorbau und kein zweiter Server in Primo: das offizielle Primo-Image
# bettet seinen Svelte-Build per go:embed ein; dort lassen sich keine eigenen
# statischen Dateien hinzufuegen. Die Uebergabeseite braucht aber DENSELBEN
# Origin wie /admin/ (nur so darf sie localStorage['pocketbase_auth'] setzen),
# also muss ein Proxy davor.

map $http_upgrade $verbindung_upgrade {
    default upgrade;
    ''      close;
}

# Log ohne Query/Fragment: die Uebergabe traegt den Token im Fragment, das nie
# an den Server geht — Anfragen auf die Seite aber ohne Query protokollieren.
# `$uri` statt `$request_uri` schuetzt zusaetzlich vor versehentlichen
# Parametern in der Adresszeile.
log_format primo_sso '$remote_addr - "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent';

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log primo_sso;
    server_name_in_redirect off;

    # Eigenes Limit fuer Primo-Uploads (Bilder/Assets im Editor). Grosszuegig,
    # aber vorhanden: ohne Limit nimmt nginx 1 MB und der Editor scheitert
    # still an groesseren Bildern.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Die Uebergabeseite ─────────────────────────────────────────────────
    # Exakter Treffer, damit ein Pfad wie /diakronos-sso.html.bak NICHT hier
    # landet. Kein Caching: die Seite ist winzig und darf nie veralten.
    location = /diakronos-sso.html {
        root /usr/share/nginx/sso;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # CSP ohne unsafe-inline waere hier der saubere Weg, geht aber nicht
        # ohne Nonce/Datei-Umbenennung. Die Seite laedt NICHTS von aussen
        # (keine Skripte, Stile, Bilder, Schriften), deshalb bleibt der
        # Spielraum eng:
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # ── Alles andere an Primo/PocketBase ──────────────────────────────────
    location / {
        proxy_pass http://primo:8080;
        proxy_http_version 1.1;

        # Host MUSS unveraendert durch: Primo waehlt die auszuliefernde Site
        # anhand des Host-Headers (serve.go: sites.host).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # PocketBase-Realtime (SSE und WebSocket) braucht beides: keine
        # Pufferung und die Upgrade-Kopfzeilen.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $verbindung_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

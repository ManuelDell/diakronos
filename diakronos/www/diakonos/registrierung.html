<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitglied werden</title>
    <meta name="csrf-token" content="{{ frappe.session.csrf_token }}">
    {%- for css in css_files %}
    <link rel="stylesheet" href="/assets/diakronos/frontend/{{ css }}">
    {%- endfor %}
  </head>
<body>
    <div id="app"></div>

    <script>
        window.__diakronos = {
            token:      {{ token | tojson }},
            linkFehler: {{ (link_fehler or "") | tojson }},
            felder:     {{ (felder or []) | tojson }},
            mitKinder:  {{ (mit_kinder or 0) | tojson }},
            dokumente:  {{ (dokumente or []) | tojson }},
        };
    </script>
    <script type="module" src="/assets/diakronos/frontend/{{ js_file }}"></script>
</body>
</html>
